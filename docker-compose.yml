version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis-gateway
    ports:
      - "6379:6379"
    restart: always

  api-gateway:
      build: .
      container_name: rate-limiter-gateway
      ports:
        - "8080:8080"
      environment:
        - REDIS_HOST=redis
        - REDIS_PORT=6379
      depends_on:
        - redis
